openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification for My Kenyan Guide
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: listings
    description: Listing CRUD operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /listings:
    get:
      operationId: listListings
      tags: [listings]
      summary: List listings
      description: Retrieve listings with optional filtering and fuzzy search
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Search query with fuzzy/typo-tolerant matching
        - name: category
          in: query
          schema:
            type: string
            enum: [providers, services, products, food, emergency, realestate, automobiles, jobs, events]
        - name: county
          in: query
          schema:
            type: string
        - name: constituency
          in: query
          schema:
            type: string
        - name: areaCode
          in: query
          schema:
            type: string
        - name: available
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of listings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Listing"
    post:
      operationId: createListing
      tags: [listings]
      summary: Create a listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingCreate"
      responses:
        "201":
          description: Listing created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
  /listings/{id}:
    get:
      operationId: getListing
      tags: [listings]
      summary: Get a listing by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Listing details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
    put:
      operationId: updateListing
      tags: [listings]
      summary: Update a listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingUpdate"
      responses:
        "200":
          description: Listing updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
    delete:
      operationId: deleteListing
      tags: [listings]
      summary: Delete a listing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Listing deleted
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Listing:
      type: object
      properties:
        id:
          type: string
        categoryId:
          type: string
          enum: [providers, services, products, food, emergency, realestate, automobiles, jobs, events]
        title:
          type: string
        subtitle:
          type: string
        description:
          type: string
        location:
          type: string
        county:
          type: string
        constituency:
          type: string
        areaCode:
          type: string
        keywords:
          type: array
          items:
            type: string
        serviceType:
          type: string
        onSite:
          type: boolean
        charges:
          type: string
        whatsapp:
          type: string
        email:
          type: string
        logoUrl:
          type: string
        price:
          type: string
        phone:
          type: string
        tags:
          type: array
          items:
            type: string
        userId:
          type: string
        verified:
          type: boolean
        available:
          type: boolean
        badge:
          type: string
        rating:
          type: number
        reviewCount:
          type: integer
        createdAt:
          type: string
        updatedAt:
          type: string
    ListingCreate:
      type: object
      required:
        - categoryId
        - title
        - subtitle
        - description
        - location
        - phone
      properties:
        categoryId:
          type: string
        title:
          type: string
        subtitle:
          type: string
        description:
          type: string
        location:
          type: string
        county:
          type: string
        constituency:
          type: string
        areaCode:
          type: string
        keywords:
          type: array
          items:
            type: string
        serviceType:
          type: string
        onSite:
          type: boolean
        charges:
          type: string
        whatsapp:
          type: string
        email:
          type: string
        logoUrl:
          type: string
        price:
          type: string
        phone:
          type: string
        tags:
          type: array
          items:
            type: string
        available:
          type: boolean
    ListingUpdate:
      type: object
      properties:
        title:
          type: string
        subtitle:
          type: string
        description:
          type: string
        location:
          type: string
        county:
          type: string
        constituency:
          type: string
        areaCode:
          type: string
        keywords:
          type: array
          items:
            type: string
        serviceType:
          type: string
        onSite:
          type: boolean
        charges:
          type: string
        whatsapp:
          type: string
        email:
          type: string
        logoUrl:
          type: string
        price:
          type: string
        phone:
          type: string
        tags:
          type: array
          items:
            type: string
        available:
          type: boolean

